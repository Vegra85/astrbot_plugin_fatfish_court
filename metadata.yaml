name: astrbot_plugin_fatfish_court
display_name: 大肥鱼 · 法庭
desc: 两个庭。纠错庭（原来的「大肥鱼 · 纠错」并进来了）：有人指出机器人说错了 → 先核对再认，真错了记成教训、同样的错不再犯；入群验证题只发数字。拉黑庭：不让一句气话就把人拉黑、也不让 AI 自己乱认错 —— 模型调工具或者管理员用指令立案 → 先不回他 → 法官（用你配的模型，推荐 DeepSeek V4 Pro 开思考）看他冲机器人说过的话判：放过 / 冷却 24 小时 → 冷却中他还冲机器人越线 → 再审删除；冷却过又被立案 → 二审。法官必须引用原话、代码核对过才算，只往轻里压。删除 = 永久不理（真做）；删好友、清数据默认只私聊提醒管理员「本来会删 / 本来会清」。还有冒充核对（自称管理员但 QQ 号不对）、申诉（被冷却的人私聊「/申诉」转给管理员）。每个庭、每个场合都能单独开关。
short_desc: 纠错庭：被指出说错了先核对再认、记教训；拉黑庭：法官判了才冷却 / 删除，默认只提醒不真删
